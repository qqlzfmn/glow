name: Bug 报告
description: 报告一个故障——灯色不对、hook 不触发、用量数据错误、外观异常、安装或运行失败
labels: [bug]
body:
  - type: dropdown
    id: module
    attributes:
      label: 功能模块
      description: 问题属于哪个模块？
      options:
        - 状态灯 & Agent 集成
        - Usage 用量
        - 外观
        - 安装与运行
        - 其他
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 现象描述
      description: 发生了什么？尽量具体（例如：Claude Code 请求权限时灯没有变黄）。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 安装 …
        2. 运行 …
        3. 观察 …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为 vs 实际行为
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Glow 版本
      description: pkg 安装包文件名，或 系统设置 → 应用程序 中的版本号；源码构建请填 commit。
      placeholder: 例如 0.1.3 / nightly 2026-09-04 / bd74fda
    validations:
      required: true

  - type: dropdown
    id: install-source
    attributes:
      label: 安装来源
      options:
        - Release pkg（正式版）
        - Nightly pkg
        - 源码构建（./scripts/build.sh）
    validations:
      required: true

  - type: input
    id: os-arch
    attributes:
      label: macOS 版本与架构
      placeholder: 例如 macOS 15.5 / Apple Silicon (arm64)
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: 涉及哪个 Agent？
      description: 状态灯 / hook 相关问题必填；其他问题选"不涉及"。
      options:
        - Codex
        - Claude Code
        - omp
        - pi
        - 不涉及
        - 不确定

  - type: dropdown
    id: provider
    attributes:
      label: 涉及哪个 Provider？
      description: 用量数据相关问题必填；其他问题选"不涉及"。
      options:
        - GLM Coding Plan
        - GLM Team Plan
        - Volcengine Ark
        - Kimi For Coding
        - MiniMax
        - ZenMux
        - OpenCode Go
        - DeepSeek
        - OpenRouter
        - SiliconFlow
        - StepFun
        - Anthropic Usage
        - OpenAI Usage
        - New API / One API
        - 不涉及
        - 不确定

  - type: markdown
    attributes:
      value: |
        > ⚠️ **脱敏警告**：`~/.config/glow/usage.json`（凭据配置）**包含 token / AccessKey，禁止直接粘贴**。
        > 可以粘贴的是状态文件 `/private/tmp/glow/usage.json`（用量快照，不含凭据），注意两者同名不同物。

  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息（可选）
      description: >-
        按模块提供：灯语 → /private/tmp/glow/sessions.json 片段与触发的 hook 事件；
        用量 → /private/tmp/glow/usage.json 状态片段、Usage 菜单中的错误文本；
        外观 → 截图与改动的外观参数；安装运行 → /private/tmp/glow/app.log 或 Console.app 崩溃日志。
      placeholder: 粘贴日志 / 配置片段（记得脱敏）或截图
