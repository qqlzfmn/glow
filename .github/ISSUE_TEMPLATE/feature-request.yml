name: 功能建议
description: 提出新功能或改进——新 Agent 集成、新 Provider、新灯语、外观与展示形态、安装体验
labels: [enhancement]
body:
  - type: dropdown
    id: module
    attributes:
      label: 功能模块
      description: 建议属于哪个模块？
      options:
        - 状态灯 & Agent 集成
        - Usage 用量
        - 外观
        - 安装与运行
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / 场景
      description: 背后的需求，而不是方案本身——你在什么场景下被什么卡住了？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望 Glow 表现出什么行为？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 可选。你试过或想过哪些别的办法，为什么不够好？

  - type: textarea
    id: context
    attributes:
      label: 补充背景
      description: >-
        可选。新 Provider 请附：计费模式（配额窗口 / 余额）、API 端点文档链接、所需凭据类型；
        新灯语信号请说明：现有四态（绿常亮 / 绿闪 / 黄闪 / 红闪，见 docs/LAMP_LANGUAGE.md）为什么不够用。
      placeholder: 参考链接、截图、其他项目的同类做法等
